name: Bug report / Сообщить об ошибке
description: Something does not work (unreadable replay, wrong count…) / Что-то не работает (повтор не читается, неверный счёт…)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? / Что произошло?
      description: What you did, what you expected, what you got. / Что ты сделал, чего ожидал, что получилось.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Chest Counter version / Версия счётчика
      description: Shown in the window title, e.g. 1.2.0. / Показана в заголовке окна, например 1.2.0.
    validations:
      required: true
  - type: input
    id: season
    attributes:
      label: Fortnite season or update / Сезон или обновление Fortnite
  - type: textarea
    id: log
    attributes:
      label: errors.log
      description: Paste the content of %APPDATA%\ChestCounter\errors.log (or attach the file). / Вставь содержимое %APPDATA%\ChestCounter\errors.log (или приложи файл).
      render: text
